    AI cluster across a set of distributed nodes despite varying configuration and
    physical location. Trusted by SGLang, vLLM, Qwen, DeepSeek, Kimi, MiniMax, Z AI.
  evidence_refs:
  - src/parallax/cli.py
  entry_path: src/parallax/cli.py
- feature: pipeline-parallel-serving
  organ_id: circulatory.compute_pool
  source_organ: circulatory.compute_pool
  synergy_targets: []
  gap_status: LIVE
  repo: parallax
  surface_type: library_function
  surface_path: src/parallax
  description: Pipeline-parallel model sharding across heterogeneous distributed nodes.
    Backends — SGLang and vLLM on GPU, MLX LM on Mac. Paged KV cache management and
    continuous batching for Mac. Dynamic request scheduling and routing for high performance.
    Cross-platform (Linux GPU + macOS).
  evidence_refs:
  - src/parallax
  entry_path: src/parallax
- feature: lattica-p2p-transport
  organ_id: circulatory.compute_pool
  source_organ: circulatory.compute_pool
  synergy_targets: []
  gap_status: LIVE
  repo: parallax
  surface_type: library_function
  surface_path: src/parallax
  description: P2P communication layer powered by Lattica (lattica==1.0.21). Carries
    pipeline-parallel activations between distributed inference nodes without a central
    coordinator. Foundation for sovereign / fully-decentralized model serving.
  evidence_refs:
  - src/parallax
  entry_path: src/parallax
- feature: model-shard-downloader
  organ_id: circulatory.compute_pool
  source_organ: circulatory.compute_pool
  synergy_targets: []
  gap_status: LIVE
  repo: parallax
  surface_type: cli_command
  surface_path: scripts/download_shard.py
  description: Downloads a specific shard of a model from HuggingFace for the local
    node to serve. Companion shell wrapper at scripts/download_model_shard.sh. Required
    before joining a distributed inference cluster.
  evidence_refs:
  - scripts/download_shard.py
  entry_path: scripts/download_shard.py
- feature: openclaw-integration
  organ_id: circulatory.compute_pool
  source_organ: circulatory.compute_pool
  synergy_targets: []
  gap_status: LIVE
