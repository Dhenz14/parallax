contracts:
- feature: parallax-cli
  organ_id: circulatory.compute_pool
  source_organ: circulatory.compute_pool
  synergy_targets: []
  gap_status: LIVE
  repo: parallax
  surface_type: cli_command
  surface_path: parallax
  description: Console entry point (pyproject.toml [project.scripts] parallax = parallax.cli:main).
